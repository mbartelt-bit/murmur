# Source of truth for apple/Murmur.xcodeproj — regenerate with `xcodegen generate`
# from this directory after every change here. Nobody hand-edits the pbxproj.
name: Murmur

options:
  bundleIdPrefix: com.murmur
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: X9PU63GUAN
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic

packages:
  MurmurShared:
    path: MurmurShared

targets:
  Murmur:
    type: application
    platform: iOS
    sources:
      - Murmur
    dependencies:
      - package: MurmurShared
        product: MurmurShared
      # The keyboard extension is what really needs these two; the app links them as well so
      # MurmurTests — which are hosted by the app — can import them, and so the DEBUG-only
      # `-murmurScreen keyboardPreview` screen can draw the keyboard without installing it.
      - package: MurmurShared
        product: MurmurKeyboardCore
      - package: MurmurShared
        product: MurmurKeyboardUI
      # Embeds MurmurKeyboard.appex into Murmur.app/PlugIns.
      - target: MurmurKeyboard
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.murmur.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      # Regenerated into Murmur/Murmur.entitlements by xcodegen; both are committed.
      # The App Group is where settings, the dictation handoff, and (from MM1 Task 2) the
      # SQLite history live so the MM2 keyboard extension can read them. The keychain group
      # shares the API keys with that extension; Xcode expands $(AppIdentifierPrefix) from
      # DEVELOPMENT_TEAM on the simulator too, whose keychain just does not enforce the
      # groups — so the same group works there with no provisioning profile.
      path: Murmur/Murmur.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.murmur.app
        keychain-access-groups:
          - "$(AppIdentifierPrefix)com.murmur.app"
    info:
      path: Murmur/Info.plist
      properties:
        CFBundleDisplayName: Murmur
        CFBundleShortVersionString: "0.1.0"
        # Read back by Keychain.defaultAccessGroup — the only way to learn the team prefix at
        # runtime on iOS (SecTaskCopyValueForEntitlement is macOS-only). Expanded on the
        # simulator as well; the accessor only falls back to "no access group" when the
        # build has no team and the literal comes through unexpanded.
        AppIdentifierPrefix: "$(AppIdentifierPrefix)"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Murmur needs the microphone to transcribe your dictation.
        NSSpeechRecognitionUsageDescription: Murmur transcribes on your device using Apple speech recognition.
        CFBundleURLTypes:
          - CFBundleURLName: com.murmur.app
            CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - murmur
    preBuildScripts:
      # Keeps MurmurCore.xcframework in step with crates/murmur-core on every build.
      # It cannot create it from nothing here: SwiftPM resolves the binary target and
      # Xcode unpacks it before this phase runs, so the framework must already exist for
      # the *first* build and a core change lands in the build after the one that
      # rebuilt it — see apple/README.md.
      #
      # No outputFiles on purpose: naming the xcframework as an output makes it both a
      # product and an input of this target and Xcode fails the build with a dependency
      # cycle. basedOnDependencyAnalysis: false is what makes the phase run every time
      # (and keeps Xcode from warning about the missing outputs).
      #
      # `env -u` strips the SDK/deployment variables Xcode exports for the simulator,
      # which would otherwise leak into the cargo cross-builds inside the script.
      - name: Build MurmurCore
        basedOnDependencyAnalysis: false
        script: |
          env -u SDKROOT -u PLATFORM_NAME -u IPHONEOS_DEPLOYMENT_TARGET \
              -u MACOSX_DEPLOYMENT_TARGET -u CPATH -u LIBRARY_PATH \
              "$SRCROOT/../scripts/build-core-mobile.sh" ios

  # The keyboard extension. It links MurmurKeyboardUI / MurmurKeyboardCore / MurmurSharedBase
  # and deliberately NOT MurmurShared or MurmurCore: an extension may not record (design spec
  # §2 constraint 1) and has roughly a 50-70 MB ceiling (constraint 5), so the Rust core, GRDB
  # and the audio/speech files stay out of its address space. See MurmurShared/Package.swift.
  #
  # No keychain access group here either: the keyboard reads no API keys. It only needs the
  # App Group, where the settings blob and the dictation hand-off live.
  MurmurKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - MurmurKeyboard
    dependencies:
      - package: MurmurShared
        product: MurmurKeyboardUI
      - package: MurmurShared
        product: MurmurKeyboardCore
      - package: MurmurShared
        product: MurmurSharedBase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.murmur.app.keyboard
        GENERATE_INFOPLIST_FILE: NO
        # Extensions ship inside the app, never on their own.
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    entitlements:
      path: MurmurKeyboard/MurmurKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.murmur.app
    info:
      path: MurmurKeyboard/Info.plist
      properties:
        CFBundleDisplayName: Murmur
        # Must match the app's, or the App Store rejects the upload.
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).KeyboardViewController"
          NSExtensionAttributes:
            # RequestsOpenAccess is what lets the user grant Full Access, which the mic
            # hand-off needs. Everything else on the keyboard works without it (4.4.1).
            RequestsOpenAccess: true
            PrimaryLanguage: en-US
            # The layout has no way to type every ASCII character (no tab, no control keys),
            # so iOS must not offer Murmur for a password or PIN field.
            IsASCIICapable: false
            PrefersRightToLeft: false

  MurmurTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MurmurTests
    dependencies:
      - target: Murmur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.murmur.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Murmur:
    build:
      targets:
        Murmur: all
        MurmurKeyboard: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MurmurTests
