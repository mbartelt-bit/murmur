[package]
name = "murmur"
version = "0.1.0"
description = "Murmur - macOS voice dictation"
authors = ["Matt Bartelt"]
edition = "2021"

[lib]
name = "murmur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-store = "2.4.3"
zeroize = "1"
cpal = "0.18"
anyhow = "1.0.103"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2", "json"] }
futures-util = "0.3"
arboard = "3"
enigo = "0.6"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
# The shared pipeline. `whisper` is desktop-only; mobile builds the same crate
# with --no-default-features.
murmur-core = { path = "../crates/murmur-core", features = ["whisper"] }

# keyring appears in both target tables because its backend is a per-OS Cargo
# feature (Keychain vs Credential Manager). whisper-rs now lives in murmur-core.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6.2"
macos-accessibility-client = "0.0.2"
objc2 = "0.6.4"
core-graphics = "0.25"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
