[package]
name = "murmur"
version = "0.1.0"
description = "Murmur - macOS voice dictation"
authors = ["Matt Bartelt"]
edition = "2021"

[lib]
name = "murmur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-store = "2.4.3"
keyring = { version = "3", features = ["apple-native"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVCaptureDevice", "AVMediaFormat"] }
block2 = "0.6.2"
macos-accessibility-client = "0.0.2"
objc2 = "0.6.4"
cpal = "0.18"
anyhow = "1.0.103"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2", "charset", "json"] }
futures-util = "0.3"
whisper-rs = { version = "0.16", features = ["metal"] }
arboard = "3"
enigo = "0.6"
