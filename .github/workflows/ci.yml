name: CI

on:
  push:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npx vitest run
      # murmur-core needs no frontend and no Tauri: run it first so a core
      # regression fails fast.
      - run: cargo test -p murmur-core
      # The core must keep cross-compiling for mobile without the desktop-only
      # `whisper` feature (whisper.cpp is never built for a phone).
      - name: Build murmur-core for iOS
        if: runner.os == 'macOS'
        run: |
          rustup target add aarch64-apple-ios aarch64-linux-android
          cargo build -p murmur-core --target aarch64-apple-ios --no-default-features
      # Build the frontend BEFORE any cargo step for the tauri crate:
      # tauri::generate_context! embeds ../dist at compile time and fails if it
      # doesn't exist.
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo build --manifest-path src-tauri/Cargo.toml
