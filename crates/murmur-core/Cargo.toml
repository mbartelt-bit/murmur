[package]
name = "murmur-core"
version = "0.1.0"
description = "Murmur's provider-agnostic dictation pipeline (shared by desktop, iOS and Android)"
authors = ["Matt Bartelt"]
edition = "2021"

[lib]
name = "murmur_core"
# `lib` keeps `cargo test -p murmur-core` working; `staticlib` feeds the iOS
# XCFramework and `cdylib` feeds the Android jniLibs / uniffi-bindgen.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
default = []
# Desktop-only: local whisper.cpp inference. Mobile builds with
# --no-default-features so cmake/whisper.cpp is never cross-compiled.
whisper = ["dep:whisper-rs"]
# Enables the uniffi-bindgen binary used by scripts/build-core-mobile.sh.
cli = ["uniffi/cli"]

[dependencies]
uniffi = { version = "0.32", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"
anyhow = "1"

# whisper-rs appears in both target tables because its backend is a per-OS
# cargo feature (Metal on macOS, CPU elsewhere), exactly as src-tauri did.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"], optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", optional = true }
